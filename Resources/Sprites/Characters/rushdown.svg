<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Rushdown (Fox archetype) placeholder sprite. CC0 public domain. -->
<!-- Small, compact, fast-looking. Orange body = Fox colour scheme. -->
<svg width="61" height="144" viewBox="0 0 61 144" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="30.5" cy="20" rx="14" ry="14" fill="#FF9500" stroke="#C06000" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="25" cy="17" r="3" fill="white"/>
  <circle cx="36" cy="17" r="3" fill="white"/>
  <circle cx="26" cy="17" r="1.5" fill="#1a1a1a"/>
  <circle cx="37" cy="17" r="1.5" fill="#1a1a1a"/>
  <!-- Body -->
  <rect x="17" y="36" width="27" height="52" rx="8" fill="#FF9500" stroke="#C06000" stroke-width="2"/>
  <!-- Torso stripe -->
  <rect x="21" y="50" width="19" height="24" rx="4" fill="#FFB840"/>
  <!-- Left arm -->
  <rect x="6" y="38" width="11" height="30" rx="5" fill="#FF9500" stroke="#C06000" stroke-width="1.5"/>
  <!-- Right arm -->
  <rect x="44" y="38" width="11" height="30" rx="5" fill="#FF9500" stroke="#C06000" stroke-width="1.5"/>
  <!-- Left leg -->
  <rect x="18" y="88" width="10" height="38" rx="5" fill="#CC6000" stroke="#903000" stroke-width="1.5"/>
  <!-- Right leg -->
  <rect x="33" y="88" width="10" height="38" rx="5" fill="#CC6000" stroke="#903000" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="23" cy="128" rx="10" ry="6" fill="#803000"/>
  <ellipse cx="38" cy="128" rx="10" ry="6" fill="#803000"/>
</svg>
