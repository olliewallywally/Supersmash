<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Bruiser (heavyweight archetype) placeholder sprite. CC0 public domain. -->
<!-- Wide, squat body. Green scales / shell colours referencing Bowser archetype. -->
<svg width="90" height="160" viewBox="0 0 90 160" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Shell / back plate -->
  <ellipse cx="45" cy="75" rx="38" ry="46" fill="#527A00" stroke="#2A4A00" stroke-width="2"/>
  <!-- Shell segments -->
  <ellipse cx="45" cy="60" rx="24" ry="16" fill="#6A9A10" stroke="#2A4A00" stroke-width="1.5"/>
  <ellipse cx="45" cy="80" rx="28" ry="14" fill="#6A9A10" stroke="#2A4A00" stroke-width="1.5"/>
  <ellipse cx="45" cy="98" rx="26" ry="12" fill="#6A9A10" stroke="#2A4A00" stroke-width="1.5"/>

  <!-- Body / belly (front) -->
  <ellipse cx="45" cy="80" rx="26" ry="36" fill="#D4A050" stroke="#A07020" stroke-width="2"/>
  <!-- Belly segments -->
  <ellipse cx="45" cy="70" rx="16" ry="10" fill="#E0B060" opacity="0.7"/>
  <ellipse cx="45" cy="84" rx="18" ry="10" fill="#E0B060" opacity="0.7"/>
  <ellipse cx="45" cy="97" rx="16" ry="8" fill="#E0B060" opacity="0.7"/>

  <!-- Head — big and round -->
  <ellipse cx="45" cy="22" rx="24" ry="22" fill="#527A00" stroke="#2A4A00" stroke-width="2"/>
  <!-- Face plate -->
  <ellipse cx="45" cy="26" rx="16" ry="14" fill="#D4A050"/>
  <!-- Eyes — fierce -->
  <circle cx="36" cy="20" r="5" fill="#FF4400"/>
  <circle cx="54" cy="20" r="5" fill="#FF4400"/>
  <circle cx="37" cy="20" r="2.5" fill="#1a0000"/>
  <circle cx="55" cy="20" r="2.5" fill="#1a0000"/>
  <!-- Eyebrow ridge -->
  <path d="M30,14 Q37,10 44,14" stroke="#2A4A00" stroke-width="3" fill="none"/>
  <path d="M46,14 Q53,10 60,14" stroke="#2A4A00" stroke-width="3" fill="none"/>
  <!-- Nostrils -->
  <circle cx="41" cy="28" r="2" fill="#A07020"/>
  <circle cx="49" cy="28" r="2" fill="#A07020"/>
  <!-- Horns -->
  <polygon points="32,6 26,0 36,10" fill="#D4A050" stroke="#A07020" stroke-width="1"/>
  <polygon points="58,6 64,0 54,10" fill="#D4A050" stroke="#A07020" stroke-width="1"/>

  <!-- Left arm — huge -->
  <rect x="3" y="50" width="16" height="44" rx="8" fill="#527A00" stroke="#2A4A00" stroke-width="1.5"/>
  <!-- Claws left -->
  <ellipse cx="11" cy="96" rx="10" ry="6" fill="#D4A050"/>
  <!-- Right arm -->
  <rect x="71" y="50" width="16" height="44" rx="8" fill="#527A00" stroke="#2A4A00" stroke-width="1.5"/>
  <!-- Claws right -->
  <ellipse cx="79" cy="96" rx="10" ry="6" fill="#D4A050"/>

  <!-- Left leg — thick -->
  <rect x="20" y="112" width="18" height="36" rx="8" fill="#3A5800" stroke="#2A4A00" stroke-width="1.5"/>
  <!-- Right leg -->
  <rect x="52" y="112" width="18" height="36" rx="8" fill="#3A5800" stroke="#2A4A00" stroke-width="1.5"/>
  <!-- Feet -->
  <ellipse cx="29" cy="150" rx="16" ry="8" fill="#2A4A00"/>
  <ellipse cx="61" cy="150" rx="16" ry="8" fill="#2A4A00"/>
</svg>
