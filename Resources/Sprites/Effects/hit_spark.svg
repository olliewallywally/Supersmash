<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- HitSpark effect sprite. CC0 public domain. -->
<!-- Import in Godot as a single-frame texture on HitSpark scenes. -->
<!-- Star-burst in yellow-white with radiating lines — classic Smash hit flash. -->
<svg width="64" height="64" viewBox="0 0 64 64" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="white"   stop-opacity="1"/>
      <stop offset="30%"  stop-color="#FFEE44" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#FF8800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Core flash -->
  <circle cx="32" cy="32" r="28" fill="url(#sparkGrad)"/>
  <!-- Star rays -->
  <line x1="32" y1="2"  x2="32" y2="18"  stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="32" y1="46" x2="32" y2="62"  stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="2"  y1="32" x2="18" y2="32"  stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="46" y1="32" x2="62" y2="32"  stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="10" y1="10" x2="21" y2="21"  stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="43" y1="43" x2="54" y2="54"  stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="54" y1="10" x2="43" y2="21"  stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="21" y1="43" x2="10" y2="54"  stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Bright white core -->
  <circle cx="32" cy="32" r="8" fill="white" opacity="0.95"/>
</svg>
