<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Shield bubble sprite. CC0 public domain. -->
<!-- Semi-transparent sphere with highlight. Scale in Godot based on shield health. -->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shieldGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="#60C0FF" stop-opacity="0.4"/>
      <stop offset="80%"  stop-color="#2060FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0040C0" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%"  stop-color="#2060FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60C0FF" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <!-- Outer rim glow -->
  <circle cx="64" cy="64" r="60" fill="url(#rimGrad)"/>
  <!-- Main sphere -->
  <circle cx="64" cy="64" r="56" fill="url(#shieldGrad)"/>
  <!-- Specular highlight -->
  <ellipse cx="48" cy="44" rx="18" ry="12" fill="white" opacity="0.5"/>
</svg>
