<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Platform tile sprite. CC0 public domain. -->
<!-- 64×32 tile. Top face is solid; sides and bottom are structural. -->
<!-- Use as a 9-slice or tile in Godot TileMap. -->
<svg width="64" height="32" viewBox="0 0 64 32" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Main surface -->
  <rect x="0" y="0" width="64" height="22" rx="4" fill="#6B8E44"/>
  <!-- Grass top band -->
  <rect x="0" y="0" width="64" height="8" rx="4" fill="#7DB847"/>
  <!-- Grass detail bumps -->
  <ellipse cx="10" cy="3" rx="6" ry="4" fill="#8DD857"/>
  <ellipse cx="28" cy="2" rx="7" ry="4" fill="#8DD857"/>
  <ellipse cx="48" cy="3" rx="6" ry="4" fill="#8DD857"/>
  <!-- Dirt body -->
  <rect x="0" y="8" width="64" height="14" fill="#8B5A2B"/>
  <!-- Dirt texture lines -->
  <line x1="8"  y1="12" x2="20" y2="12" stroke="#6B3A1B" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="14" x2="44" y2="14" stroke="#6B3A1B" stroke-width="1.5" opacity="0.6"/>
  <line x1="48" y1="11" x2="58" y2="11" stroke="#6B3A1B" stroke-width="1.5" opacity="0.6"/>
  <!-- Bottom lip -->
  <rect x="0" y="22" width="64" height="10" rx="3" fill="#5A3A18"/>
  <!-- Left edge highlight -->
  <rect x="0" y="0" width="3" height="32" rx="1" fill="white" opacity="0.15"/>
</svg>
